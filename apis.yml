aid: eola
name: eola
description: >-
  eola is a London-based online booking and business-management platform for the
  activity and leisure industry. It gives tour operators, surf and watersports
  schools, outdoor activity centres, adventure and winter-sports providers, course
  and rental businesses, and multi-site operators a single system to sell
  experiences and run their operations. The platform covers online and onsite
  point-of-sale bookings, a product builder for activities, memberships, class
  passes and rentals, instructor and resource scheduling, online waivers and
  questionnaires with AI checking, payments and reconciliation, marketing tools
  (discount codes, credit vouchers, review links, branded multi-language emails),
  reporting and analytics, an activity marketplace, and eola AI features. eola is
  backed by Techstars. It operates as a closed SaaS product: bookings are embedded
  via a first-party booking widget and business dashboard rather than a documented
  public developer API.
